<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firesale</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- controler -->
    <section class="controler">
      <button id="new-file">New File</button>
      <button id="open-file">Open File</button>
      <button id="save-file">Save File</button>
      <button id="revert-file">Revert</button>
      <button id="save-html">Save HTML</button>
      <button id="show-file">Show File</button>
      <button id="open-in-default">Open In Default Application</button>
    </section>
    <!-- content -->
    <section class="content">
      <label for="mardown" hidden>Markdown</label>
      <textarea class="row-markdown" id="markdown"></textarea>
      <div class="rendered-html" id="html"></div>
    </section>
  </body>
  <script>
    require("./renderer.js");
  </script>
</html>
